openapi: 3.1.0
info:
  title: Regulus hub API
  version: "1"
  description: |
    HTTP API of the Regulus hub, used by the dashboard.

    Everything under `/api/` needs a login (session cookie `regulus_session`) except
    the `/api/auth/*` endpoints. State-changing requests (POST, PUT, PATCH, DELETE) must send
    `Content-Type: application/json` and, if they send an `Origin` header, it must
    be the hub's own. This file is served by the hub at `/api/openapi.yaml`.
servers:
  - url: /
security:
  - cookieAuth: []
tags:
  - name: auth
  - name: agents
  - name: dashboard
  - name: accounts
  - name: updates
paths:
  /healthz:
    get:
      summary: Health check
      security: []
      responses:
        "200":
          description: The hub is running.
          content:
            text/plain:
              schema: { type: string, examples: [ok] }
  /api/auth/me:
    get:
      tags: [auth]
      summary: Who is logged in, and whether the first-run setup is pending
      security: []
      responses:
        "200":
          description: Always answers; `user` is null without a valid session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
  /api/auth/setup:
    post:
      tags: [auth]
      summary: Create the first admin and log in
      description: |
        Only possible while the hub has no accounts. Needs the one-time setup token
        that the hub writes to its log at startup (`setup_token`).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [setup_token, username, password]
              properties:
                setup_token: { type: string }
                username: { type: string, minLength: 3, maxLength: 32 }
                password: { type: string, minLength: 10, maxLength: 128 }
      responses:
        "200":
          description: The admin was created; the session cookie is set.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403":
          description: Wrong setup token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: The setup was already completed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/auth/login:
    post:
      tags: [auth]
      summary: Log in with username and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string }
      responses:
        "200":
          description: |
            Logged in and the session cookie is set, or, for an account with
            two-factor authentication, the password was right but no session exists
            yet: the answer has `two_factor_required` and a `pending_token` to send,
            with a code, to `/api/auth/login/two-factor`.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/User"
                  - $ref: "#/components/schemas/TwoFactorPending"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: Wrong username or password.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: Too many failed attempts from this address; see `Retry-After`.
          headers:
            Retry-After: { schema: { type: integer } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/auth/login/two-factor:
    post:
      tags: [auth]
      summary: Finish a login with the second factor
      description: |
        Takes the `pending_token` of `/api/auth/login` and a code: six digits from
        the authenticator app, or a recovery code (which then stops working). A
        pending login lasts five minutes and accepts five tries; wrong codes also
        count toward the limit on failed attempts. A code of the app works once.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [pending_token, code]
              properties:
                pending_token: { type: string }
                code: { type: string }
      responses:
        "200":
          description: Logged in; the session cookie is set. After a recovery code the answer says so, with the codes left.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/User"
                  - type: object
                    properties:
                      recovery_code_used: { type: boolean }
                      recovery_codes_left: { type: integer }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: Wrong code, or the pending login expired or ran out of tries.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: Too many failed attempts from this address; see `Retry-After`.
          headers:
            Retry-After: { schema: { type: integer } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/auth/logout:
    post:
      tags: [auth]
      summary: End the session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "204":
          description: The session is closed and the cookie cleared.
  /api/auth/reset:
    post:
      tags: [auth]
      summary: Choose a new password with a one-time reset token
      description: |
        The token comes from an admin (`POST /api/users/{username}/reset`) or from
        the `regulus hub reset-admin` command. It works once and expires after an
        hour. A token that is unknown, expired or used gets the same 400 answer.
        On success all sessions of the account are ended; the user then logs in
        with the new password. After 10 failed attempts from one address the
        endpoint answers 429 for a while.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, new_password]
              properties:
                token: { type: string }
                new_password: { type: string, minLength: 10, maxLength: 128 }
      responses:
        "204":
          description: The password was changed.
        "400":
          description: The token is invalid or expired, or the password is not acceptable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: Too many failed attempts from this address; see `Retry-After`.
          headers:
            Retry-After: { schema: { type: integer } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/enrollment-tokens:
    post:
      tags: [agents]
      summary: Make a one-time token to enroll a remote agent (needs servers.manage)
      description: |
        The token works once and expires after an hour; it is shown only in this
        answer. The agent needs the token, the address of the agent listener
        (the host of the hub and `agent_port`) and the `ca_fingerprint`, which it
        pins to be sure it talks to this hub. Answers 409 when the hub runs
        without `agent_listen`. The request needs a JSON body.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name:
                  type: string
                  maxLength: 64
                  description: Optional name for the server that enrolls with the token.
      responses:
        "201":
          description: The enrollment token.
          content:
            application/json:
              schema:
                type: object
                required: [token, name, expires_at, ca_fingerprint, agent_port]
                properties:
                  token: { type: string }
                  name: { type: string }
                  expires_at: { type: string, format: date-time }
                  ca_fingerprint:
                    type: string
                    example: "sha256:0f2a...e9"
                  agent_port: { type: integer }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Remote agents are off on this hub.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/updates:
    get:
      tags: [updates]
      summary: What the hub knows about updates of Regulus (needs core.update)
      description: |
        The version of the hub, the update mode and channel, the newest release on
        that channel at the last check, and the release waiting in the download
        cache, if any. `update_available` is never true for a build that is not a
        release (`release_build` false).
      responses:
        "200":
          description: The state of the updates.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UpdateStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/updates/settings:
    put:
      tags: [updates]
      summary: Choose the update mode and channel (needs core.update)
      description: |
        `manual` only tells that a new version exists; `download` also downloads
        and checks it. The `automatic` mode is refused for now: the hub cannot
        apply an update yet. Changing the channel starts a new check. The change
        is written to the audit log.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [mode, channel]
              properties:
                mode: { type: string, enum: [manual, download] }
                channel: { type: string, enum: [stable, beta] }
      responses:
        "200":
          description: The state of the updates after the change.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UpdateStatus" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/updates/check:
    post:
      tags: [updates]
      summary: Ask the release server for new releases now (needs core.update)
      description: |
        The hub also checks by itself every few hours. This answers 429 when
        the release server was asked in the last 30 seconds, 409 when checks
        are turned off (`updates.check`), and 502 when the release server
        cannot be reached or refuses (the message says why). The request needs
        a JSON body, which must be empty (`{}`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        "200":
          description: The state of the updates after the check.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UpdateStatus" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Update checks are turned off in the configuration.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "502":
          description: The release server could not be reached or refused the request.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/updates/download:
    post:
      tags: [updates]
      summary: Download and check the newest release (needs core.update)
      description: |
        Starts the download in the background and answers at once; poll
        `GET /api/updates` (`downloading`, then `staged` or `download_error`).
        The archive is checked against the SHA-256 in the release's
        `checksums.txt`, and that file's Sigstore signature is verified, before it
        is kept (`staged.verified` is `signature`).
        Nothing is installed. Answers 409 when there is no newer release, a
        download is already running, checks are off, or this build is not a
        release. The request needs a JSON body, which must be empty (`{}`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        "202":
          description: The download started.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UpdateStatus" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Nothing to download, or a download is running, or checks are off.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/agents:
    get:
      tags: [agents]
      summary: Connected agents, ordered by id
      description: |
        With `all=true` the enrolled agents that are not connected are listed
        too, with the status `offline` (or `revoked`), the last time they were
        seen and what the hub last knew about them; they have no metrics.
      parameters:
        - name: all
          in: query
          required: false
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: The agents.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Agent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/agents/{id}:
    get:
      tags: [agents]
      summary: One connected agent
      parameters:
        - $ref: "#/components/parameters/AgentID"
      responses:
        "200":
          description: The agent.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Agent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [agents]
      summary: Rename a remote agent (needs servers.manage)
      description: An empty name goes back to showing the host name. The built-in agent cannot be renamed (404).
      parameters:
        - $ref: "#/components/parameters/AgentID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: { type: string, maxLength: 64 }
      responses:
        "204":
          description: Renamed.
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [agents]
      summary: Revoke a remote agent (needs servers.manage)
      description: |
        The agent can no longer connect, and its open connection is closed. Its
        certificate is not valid again; to use the server again, enroll it with a
        new token. Revoking an agent that is already revoked succeeds. The
        built-in agent cannot be revoked (404). The request needs a JSON body
        (`{}`).
      parameters:
        - $ref: "#/components/parameters/AgentID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "204":
          description: The agent is revoked.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/agents/{id}/metrics:
    get:
      tags: [agents]
      summary: Recent metrics of an agent
      description: |
        The hub keeps the last hour (at most 3600 reports) in memory. Points are
        ordered oldest first. Network rates are computed from the counters of two
        consecutive reports and are null for the first report, after a counter
        reset and for a new interface.
      parameters:
        - $ref: "#/components/parameters/AgentID"
        - name: since
          in: query
          description: Return only points received after this time.
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: The metrics.
          content:
            application/json:
              schema:
                type: object
                required: [agent, points]
                properties:
                  agent: { type: string }
                  points:
                    type: array
                    items: { $ref: "#/components/schemas/MetricsPoint" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/stream:
    get:
      tags: [agents]
      summary: Live updates over WebSocket
      description: |
        Upgrades to a WebSocket. The hub sends JSON text messages and expects
        nothing from the client. The first message is a `snapshot`; after it come
        events as they happen. If the client reads too slowly the hub closes the
        connection (policy violation); reconnect to get a new snapshot. A page from
        another origin is refused.

        Message types (the `type` field): `snapshot` (`StreamSnapshot`),
        `agent.connected` (`agent`), `agent.disconnected` (`id`), `agent.heartbeat`
        (`id`, `at`) and `agent.metrics` (`id`, `point`).
      responses:
        "101":
          description: Switching protocols.
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/layout:
    get:
      tags: [dashboard]
      summary: Dashboard layout of the logged-in user
      responses:
        "200":
          description: 'The layout, or {"layout": null} if none was saved yet.'
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Layout" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      tags: [dashboard]
      summary: Save the dashboard layout of the logged-in user
      description: The hub stores any JSON value up to 64 KiB without interpreting it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [layout]
              properties:
                layout: {}
      responses:
        "204":
          description: Saved.
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "413":
          description: The layout is larger than 64 KiB.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/users:
    get:
      tags: [accounts]
      summary: List the accounts (needs users.manage)
      responses:
        "200":
          description: All accounts, ordered by name.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [accounts]
      summary: Create an account with an initial password (needs users.manage)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [username, password, role]
              properties:
                username: { type: string, minLength: 3, maxLength: 32 }
                password: { type: string, minLength: 10, maxLength: 128 }
                role: { type: string, description: "Name of a built-in role (admin, operator, viewer) or of a custom role." }
      responses:
        "201":
          description: The account was created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: The name is taken.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/users/{username}:
    patch:
      tags: [accounts]
      summary: Change the role of an account or disable or enable it (needs users.manage)
      description: |
        Fields that are left out stay as they are. Disabling an account ends its
        sessions. The last enabled admin cannot be demoted or disabled (409).
      parameters:
        - $ref: "#/components/parameters/Username"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                role: { type: string, description: "Name of a built-in role (admin, operator, viewer) or of a custom role." }
                disabled: { type: boolean }
      responses:
        "200":
          description: The account after the change.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The change would leave the hub without an enabled admin.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      tags: [accounts]
      summary: Delete an account and its sessions (needs users.manage)
      description: |
        The request needs a JSON body (`{}`) like every other request that changes
        something. The last enabled admin cannot be deleted (409).
      parameters:
        - $ref: "#/components/parameters/Username"
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "204":
          description: Deleted.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The account is the last enabled admin.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/users/{username}/reset:
    post:
      tags: [accounts]
      summary: Make a one-time password reset token for an account (needs users.manage)
      description: |
        The admin hands the token (or the link `/#/reset/<token>`) to the user, who
        chooses the new password; the admin never sees it. The token is shown only
        in this answer, works once and expires after an hour; a new one replaces
        the earlier one. Creating it ends all sessions of the account. The request
        needs a JSON body (`{}`). Disabled accounts cannot be reset (400).
      parameters:
        - $ref: "#/components/parameters/Username"
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "201":
          description: The reset token.
          content:
            application/json:
              schema:
                type: object
                required: [username, token, expires_at]
                properties:
                  username: { type: string }
                  token: { type: string }
                  expires_at: { type: string, format: date-time }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/audit:
    get:
      tags: [accounts]
      summary: Recent account events, newest first (needs audit.read)
      description: The hub keeps the last 10000 events.
      parameters:
        - name: limit
          in: query
          description: How many events to return (default 100, at most 500).
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: The events.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AuditEntry" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/account/password:
    post:
      tags: [accounts]
      summary: Change the own password
      description: |
        Needs the current password. All the other sessions of the user are ended.
        Wrong current passwords count toward the limit on failed attempts (429).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [current_password, new_password]
              properties:
                current_password: { type: string }
                new_password: { type: string, minLength: 10, maxLength: 128 }
      responses:
        "204":
          description: The password was changed.
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: The current password is wrong.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: Too many wrong passwords; see `Retry-After`.
          headers:
            Retry-After: { schema: { type: integer } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/account/sessions:
    get:
      tags: [accounts]
      summary: Active sessions of the logged-in user
      responses:
        "200":
          description: The sessions, most recently used first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SessionInfo" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/account/sessions/{id}:
    delete:
      tags: [accounts]
      summary: End one of the own sessions
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "204":
          description: The session was ended.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/account/two-factor:
    get:
      tags: [accounts]
      summary: Two-factor state of the logged-in user
      responses:
        "200":
          description: Whether it is on, whether the hub requires it, and the recovery codes left.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TwoFactorStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/account/two-factor/setup:
    post:
      tags: [accounts]
      summary: Start setting up two-factor authentication
      description: |
        Needs the password. Makes a new secret (replacing one that was never
        confirmed) and returns it with the QR code. Two-factor is not on until
        `/enable` confirms it with a code.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [password]
              properties:
                password: { type: string }
      responses:
        "200":
          description: The secret, the `otpauth://` URI and the QR code (PNG data URL).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TwoFactorSetup" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: The password is wrong.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Two-factor is already on.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503":
          description: The hub has no secret key, so two-factor is unavailable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/account/two-factor/enable:
    post:
      tags: [accounts]
      summary: Confirm the setup with a code and turn two-factor on
      description: Returns the ten recovery codes. They are shown only this once.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code]
              properties:
                code: { type: string }
      responses:
        "200":
          description: Two-factor is on.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecoveryCodes" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: The code is not valid.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: The setup was not started, or two-factor is already on.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/account/two-factor/disable:
    post:
      tags: [accounts]
      summary: Turn two-factor off
      description: Needs the password and a code (or a recovery code). Refused while the hub requires two-factor for the user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [password, code]
              properties:
                password: { type: string }
                code: { type: string }
      responses:
        "204":
          description: Two-factor is off.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: The password or the code is wrong.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Two-factor is not on, or the hub requires it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/account/two-factor/recovery-codes:
    post:
      tags: [accounts]
      summary: Make new recovery codes
      description: Needs the password and a code (or a recovery code). The old codes stop working.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [password, code]
              properties:
                password: { type: string }
                code: { type: string }
      responses:
        "200":
          description: The new codes, shown only this once.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecoveryCodes" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: The password or the code is wrong.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Two-factor is not on.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/users/{username}/two-factor:
    delete:
      tags: [accounts]
      summary: Remove the second factor of a user (needs users.manage)
      description: For someone who lost the app and the recovery codes. Ends the user's sessions and is audited.
      parameters:
        - $ref: "#/components/parameters/Username"
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "204":
          description: The second factor was removed.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/settings/security:
    get:
      tags: [accounts]
      summary: Who must use two-factor authentication (needs users.manage)
      responses:
        "200":
          description: The policy.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SecuritySettings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      tags: [accounts]
      summary: Change who must use two-factor authentication (needs users.manage)
      description: |
        `off`, `admins` or `all`. Users it applies to, and who have not set up
        two-factor, can use only the two-factor endpoints until they do; the
        other endpoints answer 403 with `code: two_factor_setup_required`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [two_factor_policy]
              properties:
                two_factor_policy: { type: string, enum: [off, admins, all] }
      responses:
        "200":
          description: The policy now in force.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SecuritySettings" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503":
          description: The hub has no secret key, so two-factor cannot be required.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/roles:
    get:
      tags: [accounts]
      summary: The roles and the permissions that exist (needs users.manage or roles.manage)
      description: The built-in roles first (admin, operator, viewer), then the custom ones.
      responses:
        "200":
          description: The roles with their permissions and number of users, and every permission with its description.
          content:
            application/json:
              schema:
                type: object
                required: [roles, permissions]
                properties:
                  roles:
                    type: array
                    items: { $ref: "#/components/schemas/RoleInfo" }
                  permissions:
                    type: array
                    items: { $ref: "#/components/schemas/PermissionInfo" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [accounts]
      summary: Create a custom role (needs roles.manage)
      description: You can give a role only permissions you hold yourself.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: { type: string, pattern: "^[a-z][a-z0-9_-]{1,31}$" }
                description: { type: string, maxLength: 200 }
                permissions:
                  type: array
                  items: { type: string }
      responses:
        "201":
          description: The role was created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoleInfo" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: A role with this name exists.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/roles/{name}:
    patch:
      tags: [accounts]
      summary: Rename a custom role or change its description or permissions (needs roles.manage)
      parameters:
        - $ref: "#/components/parameters/RoleName"
      description: |
        The users that have the role follow a rename and get changed permissions
        at their next request. You must hold every permission the role had and
        will have. The built-in roles cannot be changed (409).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: { type: string }
                description: { type: string, maxLength: 200 }
                permissions:
                  type: array
                  items: { type: string }
      responses:
        "200":
          description: The role as it is now.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoleInfo" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: A built-in role, or the new name is taken.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      tags: [accounts]
      summary: Delete a custom role (needs roles.manage)
      parameters:
        - $ref: "#/components/parameters/RoleName"
      description: Refused (409) while users still have it.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "204":
          description: The role was deleted.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: A built-in role, or users still have it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/openapi.yaml:
    get:
      summary: This document
      responses:
        "200":
          description: The OpenAPI description of the API.
          content:
            application/yaml:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: regulus_session
  parameters:
    Username:
      name: username
      in: path
      required: true
      schema: { type: string }
    RoleName:
      name: name
      in: path
      required: true
      schema: { type: string }
    AgentID:
      name: id
      in: path
      required: true
      schema: { type: string }
  responses:
    BadRequest:
      description: Invalid request.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: No valid session.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: |
        The logged-in user lacks the permission the endpoint needs, or the action involves an account or a role with permissions the user does not have (nobody can touch or hand out more than they hold).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Unknown agent, user or session.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooManyRequests:
      description: Too many wrong attempts; see `Retry-After`.
      headers:
        Retry-After: { schema: { type: integer } }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    UpdateInfo:
      type: object
      required: [version, tag, prerelease, url, published_at]
      properties:
        version: { type: string, example: "0.2.0" }
        tag: { type: string, example: "v0.2.0" }
        prerelease: { type: boolean }
        url: { type: string, description: Page of the release. }
        notes: { type: string, description: Release notes as plain text (cut at 8 KiB). }
        published_at: { type: string, format: date-time }
    UpdateStaged:
      type: object
      description: A release downloaded into the hub's cache.
      required: [version, tag, archive, sha256, size, verified, staged_at, signed]
      properties:
        version: { type: string }
        tag: { type: string }
        archive: { type: string, example: regulus_0.2.0_linux_amd64.tar.gz }
        sha256: { type: string }
        size: { type: integer, format: int64 }
        verified:
          type: string
          enum: [checksum, signature]
          description: |
            How far the download was checked. `signature`: checksums.txt carries a
            valid Sigstore signature made by the release workflow of this
            repository for this tag, and the archive matches it. `checksum`: only
            the SHA-256 matched, which catches a corrupt download but does not
            prove who published it. A hub refuses to keep a release whose
            signature is missing or invalid, so it reports `signature`.
        staged_at: { type: string, format: date-time }
        signed:
          type: boolean
          description: The signature bundle of checksums.txt was published and kept next to it.
    UpdateStatus:
      type: object
      required: [current_version, release_build, checks_enabled, mode, channel, platform, checked_at, checking, latest, update_available, staged, downloading]
      properties:
        current_version: { type: string }
        release_build: { type: boolean }
        checks_enabled: { type: boolean }
        mode: { type: string, enum: [manual, download] }
        channel: { type: string, enum: [stable, beta] }
        platform: { type: string, example: linux/amd64 }
        checked_at: { type: [string, "null"], format: date-time }
        check_error: { type: string }
        checking: { type: boolean }
        latest:
          oneOf:
            - { $ref: "#/components/schemas/UpdateInfo" }
            - { type: "null" }
        update_available: { type: boolean }
        staged:
          oneOf:
            - { $ref: "#/components/schemas/UpdateStaged" }
            - { type: "null" }
        downloading: { type: boolean }
        download_error: { type: string }
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
    User:
      type: object
      required: [username, role, created_at, disabled]
      properties:
        username: { type: string }
        role: { type: string, description: "Name of a built-in role (admin, operator, viewer) or of a custom role." }
        created_at: { type: string, format: date-time }
        disabled: { type: boolean, description: Disabled accounts cannot log in. }
        two_factor: { type: boolean, description: The user confirmed a second factor. }
        permissions:
          type: array
          items: { type: string }
          description: What the role allows. Only present for the logged-in user (`/api/auth/me`).
    PermissionInfo:
      type: object
      required: [id, description]
      properties:
        id: { type: string, example: servers.manage }
        description: { type: string }
    RoleInfo:
      type: object
      required: [name, description, builtin, permissions, users]
      properties:
        name: { type: string }
        description: { type: string }
        builtin: { type: boolean, description: Built-in roles cannot be changed or deleted. }
        permissions:
          type: array
          items: { type: string }
        users: { type: integer, description: How many accounts have the role. }
    TwoFactorPending:
      type: object
      required: [two_factor_required, pending_token, expires_at]
      properties:
        two_factor_required: { type: boolean, enum: [true] }
        pending_token: { type: string }
        expires_at: { type: string, format: date-time }
    TwoFactorStatus:
      type: object
      required: [enabled, mandatory, policy, recovery_codes_left]
      properties:
        enabled: { type: boolean }
        mandatory: { type: boolean, description: The hub requires two-factor from this user. }
        policy: { type: string, enum: [off, admins, all] }
        recovery_codes_left: { type: integer }
    TwoFactorSetup:
      type: object
      required: [secret, uri, qr]
      properties:
        secret: { type: string, description: The key to type into the app, in groups of four. }
        uri: { type: string, description: The otpauth address the QR code holds. }
        qr: { type: string, description: The QR code as a PNG data URL. }
    RecoveryCodes:
      type: object
      required: [recovery_codes]
      properties:
        recovery_codes:
          type: array
          items: { type: string }
    SecuritySettings:
      type: object
      required: [two_factor_policy, two_factor_available]
      properties:
        two_factor_policy: { type: string, enum: [off, admins, all] }
        two_factor_available: { type: boolean }
    SessionInfo:
      type: object
      required: [id, remote_addr, user_agent, created_at, last_used_at, expires_at, current]
      properties:
        id: { type: string }
        remote_addr: { type: string }
        user_agent: { type: string }
        created_at: { type: string, format: date-time }
        last_used_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        current: { type: boolean, description: True for the session that made the request. }
    AuditEntry:
      type: object
      required: [id, at, actor, event, target, remote, detail]
      properties:
        id: { type: integer }
        at: { type: string, format: date-time }
        actor: { type: string }
        event:
          type: string
          enum: [setup, login, login_failed, user_created, role_changed, user_disabled, user_enabled, user_deleted, password_changed, password_change_failed, session_revoked]
        target: { type: string }
        remote: { type: string }
        detail: { type: string }
    Me:
      type: object
      required: [setup_required, user, two_factor_setup_required]
      properties:
        setup_required: { type: boolean }
        two_factor_setup_required:
          type: boolean
          description: The hub requires two-factor from this user, who has not set it up; only the two-factor endpoints work until then.
        user:
          oneOf:
            - $ref: "#/components/schemas/User"
            - type: "null"
    Agent:
      type: object
      required: [id, version, status, connected_at, last_heartbeat, metrics_at, uptime_seconds]
      properties:
        id: { type: string }
        name:
          type: string
          description: The name an admin gave the server; absent if none, then show the host name.
        version: { type: string }
        status:
          type: string
          enum: [connected, stale, offline, revoked, incompatible]
          description: |
            `stale` when nothing was heard from the agent for two heartbeat
            intervals. `offline`, `revoked` and `incompatible` only appear with
            `all=true`, for enrolled agents that are not connected.
            `incompatible`: the hub refused the agent because its version cannot
            work with this hub (see `incompatible_reason`); it stays until the
            agent connects.
        hostname: { type: string }
        os: { type: string }
        os_version: { type: string }
        kernel: { type: string }
        arch: { type: string }
        cpu_count: { type: integer }
        memory_total_bytes: { type: integer }
        connected_at:
          type: [string, "null"]
          format: date-time
          description: Null for an agent that is not connected.
        last_seen_at:
          type: string
          format: date-time
          description: When an agent that is not connected was last seen.
        last_heartbeat: { type: [string, "null"], format: date-time }
        metrics_at: { type: [string, "null"], format: date-time }
        uptime_seconds: { type: [integer, "null"] }
        compatibility:
          type: string
          enum: [current, behind, ahead, unknown]
          description: |
            For a connected agent, how its release relates to the hub's. The hub
            accepts the same release series and the previous one. `behind`: older
            but supported, worth updating. `ahead`: newer than the hub (update the
            hub). `unknown`: one of the two is not a release build.
        protocol_version:
          type: integer
          description: The protocol version negotiated for the connection.
        incompatible_reason:
          type: string
          description: Why the hub refused the agent; with the status `incompatible`.
    MetricsPoint:
      type: object
      required:
        - at
        - cpu_percent
        - load_1
        - load_5
        - load_15
        - memory_total_bytes
        - memory_used_bytes
        - memory_available_bytes
        - swap_total_bytes
        - swap_used_bytes
        - uptime_seconds
        - disks
        - networks
      properties:
        at: { type: string, format: date-time, description: When the hub received the report. }
        cpu_percent: { type: number, minimum: 0, maximum: 100 }
        load_1: { type: number }
        load_5: { type: number }
        load_15: { type: number }
        memory_total_bytes: { type: integer }
        memory_used_bytes: { type: integer }
        memory_available_bytes: { type: integer }
        swap_total_bytes: { type: integer }
        swap_used_bytes: { type: integer }
        uptime_seconds: { type: integer }
        disks:
          type: array
          items:
            type: object
            required: [mount_point, filesystem, total_bytes, used_bytes]
            properties:
              mount_point: { type: string }
              filesystem: { type: string }
              total_bytes: { type: integer }
              used_bytes: { type: integer }
        networks:
          type: array
          items:
            type: object
            required: [interface, rx_bytes, tx_bytes, rx_bytes_per_sec, tx_bytes_per_sec]
            properties:
              interface: { type: string }
              rx_bytes: { type: integer }
              tx_bytes: { type: integer }
              rx_bytes_per_sec: { type: [number, "null"] }
              tx_bytes_per_sec: { type: [number, "null"] }
    Layout:
      type: object
      required: [layout, updated_at]
      properties:
        layout: {}
        updated_at: { type: [string, "null"], format: date-time }
    StreamSnapshot:
      type: object
      required: [type, stale_after_seconds, agents]
      properties:
        type: { type: string, const: snapshot }
        stale_after_seconds: { type: number }
        agents:
          type: array
          items: { $ref: "#/components/schemas/Agent" }
