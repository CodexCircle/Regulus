syntax = "proto3";

package regulus.agent.v1;

import "regulus/agent/v1/agent.proto";

// EnrollmentService registers a new agent with the hub. It is the only RPC
// that does not need a client certificate: the agent proves it may join with a
// single-use enrollment token created by an admin, and receives the client
// certificate it uses for every later connection.
service EnrollmentService {
  rpc Enroll(EnrollRequest) returns (EnrollResponse);
}

message EnrollRequest {
  // Enrollment token from the dashboard. Valid once and for a short time.
  string token = 1;
  // PKCS #10 certificate request (DER) for a key generated on the agent; the
  // private key never leaves the machine. The hub ignores the subject of the
  // request and chooses the agent id.
  bytes csr_der = 2;
  // Describes the machine, so the dashboard can show it right away.
  SystemInfo system = 3;
  string agent_version = 4;
}

message EnrollResponse {
  // Identifier of the agent; also the common name of its certificate.
  string agent_id = 1;
  // Client certificate (DER) signed by the hub's internal CA.
  bytes certificate_der = 2;
  // Certificate (DER) of the hub's CA, which the agent trusts from now on.
  bytes ca_certificate_der = 3;
}
