# Regulus hub configuration. Environment variables (REGULUS_*, also from
# /etc/regulus/regulus.env) and command-line flags override these values.
# Restart the service after changing it: sudo systemctl restart regulus

# Address of the dashboard and API. Plain HTTP: to reach the hub from other
# machines, put a reverse proxy with TLS in front and listen on 127.0.0.1:8080.
listen: ":8080"

# Address where remote agents connect (gRPC over TLS with client certificates).
# Off by default. Enable it to manage other servers: the dashboard then makes
# a one-time token and the install command for each new server. Open this port
# in the firewall only towards the servers you manage.
# agent_listen: ":8443"

# Where the hub keeps its database. Created by the service unit.
data_dir: /var/lib/regulus

# Run an agent inside the hub, so this server is managed like the others.
builtin_agent: true

# How often agents report their metrics (at least 1s).
metrics_interval: 10s

log:
  level: info # debug, info, warn, error
  format: text # text, json

# Look for new releases on GitHub every few hours (api.github.com). What to do
# when one is found, and the channel (stable, beta or alpha), are chosen in the
# dashboard. Set to false on a hub that must not contact the internet.
updates:
  check: true

# Let the dashboard install a downloaded update. The installer turns this on
# together with the systemd unit that does the installing as root (see
# regulus-update.path); on its own the setting does nothing.
  apply: false
