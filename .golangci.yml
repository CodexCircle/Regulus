version: "2"

linters:
  default: standard
  enable:
    - misspell
    - revive

  exclusions:
    rules:
      # misspell checks English; the Italian console table is full of words it
      # takes for misspellings ("integrato", "Impossibile").
      - path: internal/console/strings_it\.go
        linters:
          - misspell

  settings:
    revive:
      # Only this rule: every package must have an accurate comment (#119).
      rules:
        - name: package-comments

formatters:
  enable:
    - gofmt
