version: 2

project_name: regulus

before:
  hooks:
    # The dashboard is embedded in the binary, so it must be built first.
    - make dashboard

builds:
  - id: regulus
    main: ./cmd/regulus
    binary: regulus
    env:
      - CGO_ENABLED=0
    goos: [linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - id: regulus
    formats: [tar.gz]
    name_template: "regulus_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

nfpms:
  - id: regulus
    package_name: regulus
    vendor: CodexCircle
    homepage: https://github.com/CodexCircle/Regulus
    maintainer: CodexCircle <noreply@codexcircle.invalid>
    description: CodexCircle Server Manager (Regulus)
    license: Apache-2.0
    formats: [deb, rpm]
    bindir: /usr/bin
    # Ubuntu Server is the reference platform. The package runs the hub as the
    # unprivileged system user "regulus"; see packaging/ and the README.
    contents:
      - src: packaging/regulus.service
        dst: /usr/lib/systemd/system/regulus.service
      - src: packaging/config.yaml
        dst: /etc/regulus/config.yaml
        type: config|noreplace
        file_info:
          mode: 0640
          owner: root
          group: regulus
    scripts:
      preinstall: packaging/scripts/preinstall.sh
      postinstall: packaging/scripts/postinstall.sh
      preremove: packaging/scripts/preremove.sh
      postremove: packaging/scripts/postremove.sh
    overrides:
      deb:
        dependencies: [adduser]

checksum:
  name_template: checksums.txt
  # The installer is signed together with the packages.
  extra_files:
    - glob: packaging/install.sh

# Keyless signature (Sigstore) of the checksums file, made with the GitHub
# Actions identity of the release workflow. Verify with:
#   cosign verify-blob --bundle checksums.txt.sigstore.json \
#     --certificate-identity-regexp 'https://github.com/CodexCircle/Regulus/.github/workflows/release.yml@.*' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com checksums.txt
signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - --yes
      - --bundle=${signature}
      - ${artifact}

sboms:
  - artifacts: archive

release:
  # Published so that .../releases/latest/download/install.sh always works.
  extra_files:
    - glob: packaging/install.sh
  # Tags such as v1.2.0-beta.1 are published as pre-releases (beta channel).
  prerelease: auto

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
