name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Regulus version
      description: Output of `regulus version`
  - type: input
    id: os
    attributes:
      label: Operating system
      description: For example Ubuntu Server 24.04, amd64
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant output, with secrets removed.
      render: text
