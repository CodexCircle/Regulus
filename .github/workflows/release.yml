name: Release

# Publishes a GitHub Release for a version tag: v1.2.0 is a stable release,
# v1.2.0-beta.1 (or -rc.1) a beta, v1.2.0-alpha.1 an alpha. It runs when a tag
# is pushed, or when "Publish release" (publish-release.yml) starts it on the
# tag it made. It must run on the tag: the hub only accepts a signature made by
# release.yml@refs/tags/<tag>.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # create the release and upload assets
  id-token: write # keyless signing with Sigstore

jobs:
  release:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # GoReleaser builds the changelog from the git history
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - uses: sigstore/cosign-installer@v3
      - uses: anchore/sbom-action/download-syft@v0
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
