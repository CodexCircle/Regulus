name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets a maintainer run CI by hand (Actions tab, "Run workflow").
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go (lint, vet, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
      - run: go vet ./...
      - name: go test -race ./...
        run: |
          set -o pipefail
          go test -race ./... 2>&1 | tee go-test.log
      - name: Report failing tests
        if: failure()
        run: grep -E '^(--- FAIL|FAIL|panic:)|_test\.go:[0-9]+:' go-test.log | head -40 | sed 's/^/::error::/' || true

  release-config:
    name: Release configuration (goreleaser check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: check

  scripts:
    name: Scripts (install and release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh scripts/test-install.sh
      - run: sh scripts/test-next-version.sh

  dashboard:
    name: Dashboard (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  build:
    name: Build binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: make build
      - name: Smoke test
        run: make smoke

  proto:
    name: Protobuf (generated code up to date)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Only runs once the repository has a proto/ directory.
      - uses: actions/setup-go@v5
        if: hashFiles('proto/buf.yaml') != ''
        with:
          go-version-file: go.mod
      - run: make proto-check
        if: hashFiles('proto/buf.yaml') != ''
